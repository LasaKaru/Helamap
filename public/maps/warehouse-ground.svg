<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <pattern id="grid3" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#dbe3ee" stroke-width="1"/>
    </pattern>
    <pattern id="hatch3" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#c3cede" stroke-width="4"/>
    </pattern>
  </defs>

  <rect width="1600" height="1200" fill="#f4f7fb"/>
  <rect width="1600" height="1200" fill="url(#grid3)"/>

  <!-- outer wall -->
  <rect x="60" y="190" width="1480" height="830" fill="#ffffff" stroke="#8798b0" stroke-width="10"/>
  <rect x="60" y="190" width="1480" height="830" fill="none" stroke="#42536b" stroke-width="3"/>

  <!-- rooms -->
  <g fill="#fbfdff" stroke="#5b6d87" stroke-width="4">
    <rect x="100" y="250" width="800" height="700"/>   <!-- raw materials -->
    <rect x="980" y="250" width="520" height="700"/>   <!-- packaging -->
  </g>

  <!-- racking in raw materials -->
  <g fill="url(#hatch3)" stroke="#9fb0c6" stroke-width="2">
    <rect x="150" y="320" width="700" height="56"/>
    <rect x="150" y="440" width="700" height="56"/>
    <rect x="150" y="560" width="700" height="56"/>
    <rect x="150" y="680" width="700" height="56"/>
    <rect x="150" y="800" width="700" height="56"/>
  </g>
  <g fill="#7c8ca3" font-size="24" font-weight="600">
    <text x="120" y="358">R1</text>
    <text x="120" y="478">R2</text>
    <text x="120" y="598">R3</text>
  </g>

  <!-- packaging lines -->
  <g stroke="#9fb0c6" stroke-width="3" fill="#eef3f9">
    <rect x="1030" y="330" width="420" height="80" rx="10"/>
    <rect x="1030" y="490" width="420" height="80" rx="10"/>
    <circle cx="1120" cy="720" r="60"/>
    <circle cx="1300" cy="720" r="60"/>
    <rect x="1030" y="830" width="420" height="70" rx="8"/>
  </g>
  <text x="1240" y="960" text-anchor="middle" fill="#aebccd" font-size="26" font-weight="600" letter-spacing="4">WRAP · LABEL · PALLETISE</text>

  <!-- dock door -->
  <rect x="700" y="1010" width="200" height="26" fill="#f4f7fb"/>
  <g stroke="#42536b" stroke-width="5" fill="none">
    <path d="M 800 1090 L 800 960"/>
    <path d="M 775 995 L 800 960 L 825 995"/>
  </g>
  <text x="800" y="1130" text-anchor="middle" fill="#42536b" font-size="26" font-weight="700">GOODS IN / OUT</text>

  <!-- north arrow + title -->
  <g transform="translate(1470,100)">
    <circle r="42" fill="#ffffff" stroke="#8798b0" stroke-width="3"/>
    <path d="M 0 -26 L 12 18 L 0 9 L -12 18 Z" fill="#42536b"/>
    <text y="-52" text-anchor="middle" fill="#42536b" font-size="24" font-weight="700">N</text>
  </g>
  <g transform="translate(90,110)">
    <text y="-14" fill="#7c8ca3" font-size="24" font-weight="600">WAREHOUSE ANNEX · GROUND FLOOR · 1:200</text>
    <rect x="0" y="0" width="100" height="12" fill="#42536b"/>
    <rect x="100" y="0" width="100" height="12" fill="#ffffff" stroke="#42536b" stroke-width="2"/>
    <text x="210" y="12" fill="#7c8ca3" font-size="22">10 m</text>
  </g>
</svg>
