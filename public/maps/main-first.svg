<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1400" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <pattern id="grid2" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#dbe3ee" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="2000" height="1400" fill="#f4f7fb"/>
  <rect width="2000" height="1400" fill="url(#grid2)"/>

  <!-- outer wall -->
  <rect x="60" y="240" width="1880" height="1120" fill="#ffffff" stroke="#8798b0" stroke-width="10"/>
  <rect x="60" y="240" width="1880" height="1120" fill="none" stroke="#42536b" stroke-width="3"/>

  <!-- rooms -->
  <g fill="#fbfdff" stroke="#5b6d87" stroke-width="4">
    <rect x="100" y="300" width="600" height="460"/>   <!-- calendar / planning -->
    <rect x="780" y="300" width="520" height="460"/>   <!-- admin -->
    <rect x="1380" y="300" width="500" height="460"/>  <!-- meetings -->
    <rect x="100" y="860" width="800" height="440"/>   <!-- r&d -->
    <rect x="980" y="860" width="900" height="440" fill="#f2f6fb"/> <!-- open plan -->
  </g>

  <!-- planning board -->
  <g stroke="#9fb0c6" stroke-width="3" fill="#eef3f9">
    <rect x="140" y="340" width="520" height="50" rx="6"/>
    <rect x="150" y="470" width="220" height="110" rx="8"/>
    <rect x="430" y="470" width="220" height="110" rx="8"/>
    <rect x="150" y="620" width="500" height="90" rx="8"/>
  </g>

  <!-- admin desks -->
  <g stroke="#9fb0c6" stroke-width="3" fill="#eef3f9">
    <rect x="830" y="360" width="130" height="70" rx="6"/>
    <rect x="1010" y="360" width="130" height="70" rx="6"/>
    <rect x="830" y="500" width="130" height="70" rx="6"/>
    <rect x="1010" y="500" width="130" height="70" rx="6"/>
    <rect x="830" y="640" width="310" height="70" rx="6"/>
  </g>

  <!-- meeting rooms M1-M4 -->
  <g stroke="#9fb0c6" stroke-width="3" fill="#eef3f9">
    <rect x="1420" y="340" width="200" height="170" rx="8"/>
    <rect x="1650" y="340" width="200" height="170" rx="8"/>
    <rect x="1420" y="550" width="200" height="170" rx="8"/>
    <rect x="1650" y="550" width="200" height="170" rx="8"/>
  </g>
  <g fill="#7c8ca3" font-size="28" font-weight="600" text-anchor="middle">
    <text x="1520" y="435">M1</text>
    <text x="1750" y="435">M2</text>
    <text x="1520" y="645">M3</text>
    <text x="1750" y="645">M4</text>
  </g>

  <!-- R&D benches -->
  <g stroke="#9fb0c6" stroke-width="3" fill="#eef3f9">
    <rect x="150" y="920" width="320" height="70" rx="6"/>
    <rect x="530" y="920" width="320" height="70" rx="6"/>
    <rect x="150" y="1060" width="320" height="70" rx="6"/>
    <rect x="530" y="1060" width="320" height="70" rx="6"/>
    <rect x="150" y="1200" width="700" height="60" rx="6"/>
  </g>

  <!-- open plan label -->
  <text x="1430" y="1090" text-anchor="middle" fill="#aebccd" font-size="34" font-weight="600" letter-spacing="6">OPEN PLAN</text>

  <!-- stairs -->
  <g stroke="#5b6d87" stroke-width="3" fill="#e5ecf5">
    <rect x="940" y="1160" width="180" height="120"/>
    <line x1="970" y1="1160" x2="970" y2="1280"/>
    <line x1="1000" y1="1160" x2="1000" y2="1280"/>
    <line x1="1030" y1="1160" x2="1030" y2="1280"/>
    <line x1="1060" y1="1160" x2="1060" y2="1280"/>
    <line x1="1090" y1="1160" x2="1090" y2="1280"/>
  </g>
  <text x="1030" y="1145" text-anchor="middle" fill="#7c8ca3" font-size="22" font-weight="600">STAIRS</text>

  <!-- corridor -->
  <g stroke="#c3cede" stroke-width="2" stroke-dasharray="14 10" fill="none">
    <line x1="100" y1="810" x2="1880" y2="810"/>
    <line x1="740" y1="300" x2="740" y2="760"/>
    <line x1="1340" y1="300" x2="1340" y2="760"/>
  </g>

  <!-- north arrow + title -->
  <g transform="translate(1870,110)">
    <circle r="46" fill="#ffffff" stroke="#8798b0" stroke-width="3"/>
    <path d="M 0 -30 L 14 20 L 0 10 L -14 20 Z" fill="#42536b"/>
    <text y="-56" text-anchor="middle" fill="#42536b" font-size="26" font-weight="700">N</text>
  </g>
  <g transform="translate(90,120)">
    <text y="-14" fill="#7c8ca3" font-size="24" font-weight="600">MAIN PRODUCTION HALL · FIRST FLOOR · 1:200</text>
    <rect x="0" y="0" width="100" height="12" fill="#42536b"/>
    <rect x="100" y="0" width="100" height="12" fill="#ffffff" stroke="#42536b" stroke-width="2"/>
    <text x="210" y="12" fill="#7c8ca3" font-size="22">10 m</text>
  </g>
</svg>
