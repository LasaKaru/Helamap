# nginx SPA config for FacilityFlow (used by the frontend Docker image;
# also a reference for VPS deployments).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed assets, no cache for data the admin replaces.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /data/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback — clean URLs all serve the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy the API when running backend mode on the same host.
    # location /api/ {
    #     proxy_pass http://backend:4000;
    #     proxy_set_header Host $host;
    # }
}
